metadata:
  name: pth-facebookresearch-sam3
  namespace: cvat
  annotations:
    name: Segment Anything 3
    version: 2
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: 0
    startswith_box_optional: true
    help_message: The interactor allows to get a mask of an object using positive and negative points and/or a bounding box

spec:
  description: Interactive object segmentation with SAM 3
  runtime: 'python:3.12'
  handler: main:handler
  eventTimeout: 180s
  env:
    - name: CHECKPOINT_PATH
      value: /opt/nuclio/sam3/sam3.pt
    - name: DEVICE
      value: cpu
    - name: PYTHONPATH
      value: /opt/nuclio/sam3

  build:
    image: cvat.pth.facebookresearch.sam3
    baseImage: python:3.12-slim
    directives:
      preCopy:
        - kind: RUN
          value: apt-get update && apt-get install -y --no-install-recommends git curl libgl1 libglib2.0-0 libgomp1 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
        - kind: RUN
          value: pip install --no-cache-dir setuptools "git+https://github.com/facebookresearch/sam3.git" scikit-image pillow
        - kind: WORKDIR
          value: /opt/nuclio/sam3
        # Ungated mirror of the official facebook/sam3 checkpoint. To use the
        # official gated repo instead, replace the URL with
        # https://huggingface.co/facebook/sam3/resolve/main/sam3.pt and add
        # -H "Authorization: Bearer <your HF token>" to the curl command.
        - kind: RUN
          value: curl -L --fail --retry 5 --retry-all-errors -o sam3.pt https://huggingface.co/1038lab/sam3/resolve/main/sam3.pt
        # Extra runtime dependencies not declared in sam3's pyproject.
        - kind: RUN
          value: pip install --no-cache-dir einops triton pycocotools psutil
        # SAM 3 precomputes position-encoding caches on "cuda" unconditionally,
        # which crashes model construction on CPU-only hosts.
        - kind: RUN
          value: sed -i 's|torch.zeros((1, 1) + size, device="cuda")|torch.zeros((1, 1) + size, device="cuda" if torch.cuda.is_available() else "cpu")|' /usr/local/lib/python3.12/site-packages/sam3/model/position_encoding.py
        - kind: RUN
          value: sed -i 's|feat_size, feat_size, device="cuda"|feat_size, feat_size, device="cuda" if torch.cuda.is_available() else "cpu"|' /usr/local/lib/python3.12/site-packages/sam3/model/decoder.py

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
      network: cvat_cvat
