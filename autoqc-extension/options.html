<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CVAT AutoQC — settings</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #f0f2f5; color: #262626; font: 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    main { max-width: 720px; margin: 24px auto; display: grid; gap: 16px; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 14px; margin: 0 0 12px; color: #595959; }
    section { background: #fff; border: 1px solid #d9d9d9; border-radius: 2px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
    label { display: block; margin-bottom: 4px; color: #595959; }
    input { box-sizing: border-box; width: 100%; height: 32px; border: 1px solid #d9d9d9; border-radius: 2px; padding: 4px 11px; }
    input:focus { border-color: #40a9ff; outline: none; box-shadow: 0 0 0 2px rgba(24,144,255,.2); }
    .row { display: flex; gap: 12px; align-items: end; }
    .row > div { flex: 1; }
    button { height: 32px; border: 1px solid #d9d9d9; border-radius: 2px; background: #fff; color: #262626; cursor: pointer; padding: 0 15px; }
    button.primary { background: #1890ff; border-color: #1890ff; color: #fff; }
    button:hover { border-color: #40a9ff; color: #40a9ff; }
    button.primary:hover { background: #40a9ff; color: #fff; }
    .hint { color: #8c8c8c; font-size: 12px; }
    #status { min-height: 20px; }
    .ok { color: #389e0d; } .err { color: #cf1322; }
  </style>
</head>
<body>
<main>
  <h1>CVAT AutoQC</h1>
  <section>
    <h2>Server</h2>
    <div class="row">
      <div>
        <label for="server">AutoQC server URL</label>
        <input id="server" type="text" spellcheck="false" placeholder="http://localhost:58220">
      </div>
      <div>
        <label for="timeout">Timeout (seconds)</label>
        <input id="timeout" type="number" min="30" max="900" value="300">
      </div>
    </div>
  </section>
  <section>
    <h2>CVAT</h2>
    <div class="row">
      <div>
        <label for="cvatHost">CVAT host</label>
        <input id="cvatHost" type="text" spellcheck="false" placeholder="http://localhost:8080">
      </div>
      <div>
        <label for="token">Personal Access Token</label>
        <input id="token" type="password" spellcheck="false">
      </div>
    </div>
    <p class="hint">Token được lưu trong chrome.storage.local của máy này. Worker dùng token để đọc job và annotation.</p>
  </section>
  <section>
    <div class="row">
      <button id="save" class="primary">Save</button>
      <button id="test">Test connection</button>
      <span id="status"></span>
    </div>
  </section>
</main>
<script src="options.js"></script>
</body>
</html>
